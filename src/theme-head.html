  <script id="theme-fonts">
    // Load optional display families only when the active theme needs them.
    window.loadThemeFont = theme => {
      const families = { 'golden-hour-dock': 'Newsreader', 'village-heritage': 'Fraunces' };
      const family = families[theme];
      if (!family || document.getElementById(`font-${family}`)) return;
      const link = document.createElement('link');
      link.id = `font-${family}`;
      link.rel = 'stylesheet';
      link.href = `https://fonts.googleapis.com/css2?family=${family}:wght@400;500&display=swap`;
      document.head.append(link);
    };
    // Restore the saved palette before styles or page content can paint.
    (() => {
      const themes = ['deep-lake-lodge', 'golden-hour-dock', 'morning-mist', 'village-heritage', 'night-sky'];
      try {
        const cookie = document.cookie.split(';').map(part => part.trim())
          .find(part => part.startsWith('lakearrowhead_theme='));
        const savedTheme = cookie?.slice('lakearrowhead_theme='.length);
        if (themes.includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
      } catch {
        // The default palette still works when browser storage is unavailable.
      }
    })();
    window.loadThemeFont(document.documentElement.dataset.theme);
  </script>

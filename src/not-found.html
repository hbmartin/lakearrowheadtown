<!DOCTYPE html>
<html lang="en" data-theme="deep-lake-lodge">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="{{site.background}}">
  <title>Page not found | {{site.name}}</title>
  <!-- theme-head -->
  <style>
    * { box-sizing: border-box; }
    html { overflow-wrap: break-word; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: var(--page-bg); color: var(--text); font: 1rem/1.6 var(--body-font); font-optical-sizing: auto; }
    main { width: 100%; max-width: 36rem; }
    .eyebrow { color: var(--muted); letter-spacing: .08em; font-size: .8rem; text-transform: uppercase; }
    h1 { margin: 1rem 0; color: var(--heading); font: var(--heading-weight) clamp(2.5rem, 8vw, 4rem)/1.1 var(--display-font); }
    p { margin: 1rem 0; }
    a { display: inline-block; margin-top: 1rem; color: var(--primary); text-underline-offset: .25em; }
    a:focus-visible { outline: 3px solid var(--primary); outline-offset: 6px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">{{site.name}} &middot; 404</p>
    <h1>Page not found</h1>
    <p>We couldn't find the page you're looking for. Head home for the latest community news.</p>
    <a href="/">Back to {{site.name}}</a>
  </main>
</body>
</html>

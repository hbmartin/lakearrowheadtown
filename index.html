<!DOCTYPE html>
<html lang="en" data-theme="deep-lake-lodge">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- page-meta -->
  <!-- theme-head -->
  <style>
    .digest-header a { color: inherit; }
    .calendar-page { max-width: 52rem; }
    .calendar-page > h2 { font-size: clamp(1.75rem, 4vw, 2.5rem); }
    .calendar-intro { margin-block: 1rem 2rem; color: var(--muted); }
    .event-when { color: var(--text); }
    .event-location { margin-top: .5rem; color: var(--muted); font-size: .9375rem; }
    .event-source { margin-top: 1rem; }
    .alerts-banner { margin-bottom: 2rem; border: 1px solid var(--muted); border-radius: .65rem; overflow: hidden; background: var(--page-bg); }
    .alert-group + .alert-group { border-top: 1px solid var(--muted); }
    .alert-group > h2 { padding: .65rem 1rem; color: var(--primary); font: 600 .875rem var(--body-font); letter-spacing: .04em; text-transform: uppercase; }
    .alert-item { position: relative; }
    .alert-row { border-top: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); }
    .alert-row > summary { display: grid; grid-template-columns: .65em minmax(0, 1fr); column-gap: .5rem; min-height: 44px; padding: .65rem 3.5rem .65rem 1rem; cursor: pointer; list-style: none; }
    .alert-dismiss { position: absolute; top: 1px; right: .35rem; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; padding: .5rem; border: 0; border-radius: .3rem; background: transparent; color: var(--muted); font-size: 1.25rem; }
    .alert-dismiss:hover { background: var(--surface); color: var(--text); }
    .alert-dismiss:focus-visible { outline-offset: -4px; }
    .alert-row > summary::marker { content: ''; }
    .alert-row > summary::-webkit-details-marker { display: none; }
    .alert-row > summary::before { content: ''; width: .65em; height: .75em; margin-top: .375em; background: currentColor; clip-path: polygon(15% 0, 100% 50%, 15% 100%); }
    .alert-row[open] > summary::before { transform: rotate(90deg); }
    .alert-summary { display: block; min-width: 0; }
    .alert-location { font-weight: 600; margin-right: .65rem; }
    .alert-headline { overflow-wrap: anywhere; }
    .alert-details { padding: .25rem 1rem 1rem; font-size: .9375rem; }
    .alert-details .markdown > :first-child { margin-top: 0; }
    .alert-facts { display: grid; gap: .4rem; margin-top: .75rem; }
    .alert-facts > div { display: flex; flex-wrap: wrap; gap: .15rem .65rem; }
    .alert-facts dt { color: var(--muted); }
    .alert-facts dd { overflow-wrap: anywhere; }
    .alert-source { margin-top: .75rem; }
    .homepage-conditions { margin-bottom: 2.5rem; }
    .conditions-as-of { color: var(--muted); font-size: .75rem; margin-bottom: .65rem; }
    .conditions-row { display: grid; gap: 1rem; align-items: start; }
    .conditions-unavailable + .conditions-row { margin-top: 1rem; }
    .homepage-conditions .alerts-banner { margin-bottom: 0; }
    .weather-card { min-width: 0; padding: 1.25rem; border: 1px solid var(--border); border-radius: .65rem; background: var(--surface); box-shadow: var(--shadow); }
    .weather-card h2, .weather-card h3 { color: var(--primary); font: 600 1rem var(--body-font); }
    .weather-station, .weather-time { color: var(--muted); font-size: .75rem; margin-top: .5rem; }
    .weather-temperature { font: 600 clamp(2.5rem, 5vw, 4rem)/1.15 var(--heading-font, var(--body-font)); margin-top: .5rem; font-variant-numeric: tabular-nums; }
    .weather-high-low { margin-top: .5rem; font-size: .875rem; }
    .weather-outlook { margin-top: .65rem; }
    .weather-toggle { display: none; align-items: center; justify-content: space-between; gap: 1rem; width: 100%; min-height: 44px; margin-top: .75rem; padding: .5rem 0 0; border: 0; background: transparent; color: var(--primary); text-align: left; font-size: .875rem; }
    .weather-details { margin-top: 1rem; }
    .weather-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 1rem; margin-top: 1rem; }
    .weather-metrics dt { font-size: .75rem; color: var(--muted); }
    .weather-metrics dd { margin-top: .25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .weather-chart { margin-top: 1.5rem; }
    .weather-chart figcaption { font-size: .875rem; font-weight: 600; }
    .weather-chart-scroll { overflow-x: auto; overscroll-behavior-x: contain; margin-top: .5rem; }
    .weather-chart svg { width: 100%; min-width: 54rem; height: auto; overflow: visible; }
    .weather-chart text { fill: var(--muted); font: 12px var(--body-font); }
    .weather-chart .weather-rain { fill: var(--primary); font-size: 11px; }
    .weather-grid { stroke: var(--border); stroke-width: 1; }
    .weather-line { fill: none; stroke: var(--primary); stroke-width: 2; }
    .weather-point { fill: var(--primary); }
    .weather-band-0 { fill: var(--primary); fill-opacity: .10; stroke: var(--primary); stroke-opacity: .10; }
    .weather-band-1 { fill: var(--primary); fill-opacity: .17; stroke: var(--primary); stroke-opacity: .17; }
    .weather-band-2 { fill: var(--primary); fill-opacity: .24; stroke: var(--primary); stroke-opacity: .24; }
    .weather-band-key { margin-top: .5rem; color: var(--muted); font-size: .75rem; }
    .weather-hourly-text { margin-top: .75rem; font-size: .875rem; }
    .weather-hourly-text summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
    .weather-hourly-text ul { padding-left: 1.25rem; }
    .weather-full-link { margin-top: 1rem; font-size: .875rem; }
    .weather-interactive .weather-toggle { display: flex; }
    .weather-interactive .conditions-row > .weather-card { cursor: pointer; }
    .weather-interactive:not(.weather-expanded) .weather-details { display: none; }
    @media (max-width: 959px) {
      .conditions-row .weather-high-low { display: none; }
      .weather-card { padding: 1rem; }
      .weather-temperature { font-size: 2.5rem; }
    }
    @media (min-width: 960px) {
      .has-alerts.has-weather .conditions-row { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
      .homepage-conditions:not(.has-alerts) .weather-details { display: block; margin-top: 0; border-top: 0; border-radius: 0 0 .65rem .65rem; box-shadow: none; }
      .homepage-conditions:not(.has-alerts) .conditions-row > .weather-card { border-bottom: 0; border-radius: .65rem .65rem 0 0; box-shadow: none; display: grid; grid-template-columns: auto 1fr; column-gap: 2rem; }
      .homepage-conditions:not(.has-alerts) .weather-temperature { grid-column: 1; grid-row: 2 / 5; }
      .homepage-conditions:not(.has-alerts) .weather-station, .homepage-conditions:not(.has-alerts) .weather-high-low, .homepage-conditions:not(.has-alerts) .weather-outlook { grid-column: 2; }
      .homepage-conditions:not(.has-alerts) .weather-toggle { display: none; }
      .homepage-conditions:not(.has-alerts) .conditions-row > .weather-card { cursor: auto; }
      .homepage-conditions:not(.has-alerts) .weather-details > h3 { display: none; }
    }
    @media (forced-colors: active) {
      .weather-line, .weather-grid { stroke: CanvasText; }
      .weather-point { fill: CanvasText; }
      .weather-band-0, .weather-band-1, .weather-band-2 { fill: Highlight; }
    }
    .resource-page { max-width: 48rem; }
    .resource-page h2 { margin-bottom: 1rem; }
    .resource-page p, .resource-page ul { margin: 1rem 0; }
    /* Modern reset: normalize the canvas while keeping native accessibility. */
    *, *::before, *::after { box-sizing: border-box; }
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overflow-wrap: break-word;
    }
    body, h1, h2, h3, h4, h5, h6, p, figure, blockquote, dl, dd { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    img, picture, video, canvas, svg { display: block; max-width: 100%; }
    img, video { height: auto; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    textarea { resize: vertical; }
    h1, h2, h3, h4, h5, h6 { text-wrap: balance; }
    p { text-wrap: pretty; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid var(--primary, #2E5F73); outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    body {
      position: relative;
      isolation: isolate;
      padding-bottom: 3rem;
      background-color: var(--page-bg);
      background-image: var(--atmosphere);
      background-size: 100% 34rem;
      background-repeat: no-repeat;
      color: var(--text);
      font-family: var(--body-font);
      font-size: 1rem;
      font-optical-sizing: auto;
    }
    body::before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background-image: var(--texture);
      background-size: var(--texture-size);
      opacity: var(--texture-opacity);
      -webkit-mask-image: linear-gradient(90deg, #000, transparent 22%, transparent 78%, #000), linear-gradient(#000, transparent 26rem);
      mask-image: linear-gradient(90deg, #000, transparent 22%, transparent 78%, #000), linear-gradient(#000, transparent 26rem);
    }
    body > header, main, body > footer {
      width: min(calc(100% - var(--gutter) * 2), 72rem);
      margin-inline: auto;
    }
    body > header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-block: 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    h1, h2, h3, h4, h5, h6 {
      color: var(--heading);
      font-family: var(--display-font);
      font-weight: var(--heading-weight);
      letter-spacing: -0.035em;
      line-height: 1.06;
    }
    body > header h1 { flex: 1; min-width: 0; font-size: clamp(1.5rem, 6.3vw, 3.5rem); line-height: 1.1; text-wrap: wrap; }
    main { padding-block: clamp(2rem, 5vw, 4rem); }
    a { color: var(--primary); text-underline-offset: 0.2em; }
    ::selection { background: var(--selected-bg); color: var(--text); }

    .site-title { color: inherit; text-decoration: none; }
    .site-title-tail { white-space: nowrap; }
    .site-dot { display: inline-block; width: 0.16em; height: 0.16em; overflow: hidden; border-radius: 50%; background: var(--accent); color: transparent; line-height: 0; vertical-align: 0.2em; }
    .digest { max-width: 52rem; }
    .snapshot-meta { max-width: 52rem; margin-top: 0.75rem; }
    .digest + .digest { margin-top: 4rem; padding-top: 3rem; border-top: 1px solid var(--border); }
    .digest-header { margin-bottom: 1rem; }
    .digest-header :is(h2, h3) { color: var(--muted); font-family: var(--body-font); font-size: 0.875rem; font-weight: 500; line-height: 1.5; letter-spacing: normal; }
    .digest-item { padding-block: 1.75rem; border-top: 1px solid var(--border); }
    .digest-header + .digest-item { padding-top: 0; border-top: 0; }
    .item-meta { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: baseline; color: var(--muted); font-size: 0.8125rem; }
    .story-updates { margin-top: 0.75rem; padding-left: 1rem; border-left: 2px solid var(--border); }
    .story-update + .story-update { margin-top: 1.25rem; }
    .category { padding: 0.125rem 0.5rem; border: 1px solid var(--border); border-radius: 0.375rem; }
    .digest-item > :is(h3, h4) { margin-top: 0.875rem; font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.2; }
    .headline-link { display: block; color: inherit; text-decoration: none; }
    .headline-link:hover { text-decoration: underline; }
    .headline-link:focus-visible { text-decoration: none; }
    .markdown { display: flow-root; --thumbnail-size: 160px; --thumbnail-gap: 16px; margin-top: 1rem; line-height: 1.75; }
    .markdown > * + * { margin-top: 1rem; }
    .markdown > .article-thumbnail + * { margin-top: 0; }
    .markdown :is(h1, h2, h3, h4, h5, h6) { max-width: none; font-size: 1.25rem; line-height: 1.4; }
    .article-image { display: inline-block; max-width: var(--thumbnail-size); vertical-align: top; border-radius: var(--radius); }
    .article-thumbnail { float: left; margin: 0 var(--thumbnail-gap) var(--thumbnail-gap) 0; }
    .markdown img { max-width: 100%; max-height: var(--thumbnail-size); width: auto; height: auto; border-radius: var(--radius); }
    .markdown :is(ul, ol) { display: flow-root; }
    .markdown blockquote { padding-left: 1rem; border-left: 3px solid var(--accent); color: var(--muted); }
    .markdown pre { overflow-x: auto; padding: 1rem; border-radius: var(--radius); background: var(--surface); }
    .markdown table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
    .markdown :is(th, td) { padding: 0.5rem 0.75rem; border: 1px solid var(--border); }
    @media (max-width: 600px) {
      :root { --gutter: 1rem; }
      body > header { gap: 0.5rem; padding-block: 1rem 0.75rem; }
      main { padding-block: 1rem 2rem; }
      .digest + .digest { margin-top: 1.5rem; padding-top: 1rem; }
      .digest-header { margin-bottom: 0.75rem; }
      .digest-header :is(h2, h3) { font-size: 0.8125rem; }
      .digest-item { padding-block: 1rem; }
      .item-meta { gap: 0.375rem 0.75rem; }
      .item-group { display: none; }
      .digest-item > :is(h3, h4) { margin-top: 0.5rem; font-size: clamp(1.25rem, 5.1vw, 1.375rem); }
      .markdown { --thumbnail-size: 96px; --thumbnail-gap: 12px; margin-top: 0.625rem; line-height: 1.6; }
      .markdown > * + * { margin-top: 0.75rem; }
    }
    .empty-state { max-width: 45ch; color: var(--muted); line-height: 1.75; }
    body > footer { padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.8125rem; }

    .back-to-top {
      position: fixed;
      z-index: 5;
      left: calc(1rem + env(safe-area-inset-left, 0px));
      bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow);
    }
    .back-to-top:hover { background: var(--surface-hover); }
    .back-to-top-ring { position: absolute; inset: 0; pointer-events: none; }
    .scroll-track { stroke: var(--control-border); }
    .scroll-progress { stroke: currentColor; }
    @media print {
      .back-to-top { display: none; }
    }

    .header-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .theme-picker {
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      font-size: 0.875rem;
    }
    .theme-trigger, .weather-link {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      margin-left: auto;
      padding: 0;
      border: 1px solid var(--control-border);
      border-radius: 50%;
      background: var(--surface);
    }
    .theme-trigger:hover, .theme-trigger[aria-expanded="true"], .weather-link:hover { background: var(--surface-hover); }
    .theme-trigger > svg, .weather-link > svg { color: var(--primary); }
    .weather-link { text-decoration: none; }
    .theme-panel {
      position: absolute;
      right: 0;
      top: calc(100% + 0.5rem);
      width: min(22rem, calc(100vw - var(--gutter) * 2));
      max-height: calc(100vh - 6rem);
      max-height: calc(100svh - 6rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .theme-panel fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
    .theme-panel legend { padding: 0 0 0.875rem; font-size: 1rem; font-weight: 600; }
    .theme-options { display: grid; gap: 0.5rem; }
    .theme-option {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.875rem;
      border: 1px solid transparent;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .theme-option:hover { background: var(--surface-hover); }
    .theme-option:has(input:checked) { border-color: var(--primary); background: var(--selected-bg); }
    .theme-option:has(input:checked) .theme-description { color: var(--text); }
    .theme-option input {
      flex: 0 0 1.125rem;
      width: 1.125rem;
      height: 1.125rem;
      margin: 0.15rem 0 0;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .theme-option-copy { min-width: 0; }
    .theme-name { display: block; font-weight: 600; }
    .theme-description { display: block; margin-top: 0.125rem; color: var(--muted); font-size: 0.75rem; }
    .theme-swatches { display: flex; gap: 0.3rem; margin-top: 0.625rem; }
    .theme-swatches > span {
      width: 0.875rem;
      height: 0.875rem;
      border: 1px solid rgb(0 0 0 / 12%);
      border-radius: 50%;
      background: var(--swatch);
    }
    @media (prefers-reduced-motion: no-preference) {
      body, .back-to-top, .theme-trigger, .weather-link, .theme-panel, .theme-option {
        transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease;
      }
    }
    @media (forced-colors: active) {
      .site-dot { forced-color-adjust: none; background: LinkText; }
      .scroll-track { stroke: ButtonText; }
      .scroll-progress { stroke: Highlight; }
      .theme-option:has(input:checked) { border-color: Highlight; }
      .theme-swatches { forced-color-adjust: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1><a class="site-title" href="/" aria-label="Lake Arrowhead . Town">Lake Arrowhead <span class="site-title-tail"><span class="site-dot" aria-hidden="true">.</span> Town</span></a></h1>
    <div class="header-actions">
      <a class="weather-link" href="https://weather.lakearrowhead.town" aria-label="Weather" title="Weather">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">

      </a>
      <div class="theme-picker" hidden>
        <div class="theme-panel" id="theme-panel" hidden>

            <legend>Choose a theme</legend>

                  <span class="theme-description">Evergreen, lake blue &amp; cedar</span>
                  <span class="theme-swatches" aria-hidden="true">
                    <span style="--swatch: #1B3B1F"></span><span style="--swatch: #2E5F73"></span><span style="--swatch: #CBD6D6"></span><span style="--swatch: #8A8E93"></span><span style="--swatch: #8A6B4F"></span><span style="--swatch: #F8F6F1"></span>
                  </span>
                </span>
              </label>
              <label class="theme-option">
                <input type="radio" name="theme" value="golden-hour-dock">
                <span class="theme-option-copy">
                  <span class="theme-name">Golden Hour Dock</span>
                  <span class="theme-description">Warm amber, plum &amp; linen</span>
                  <span class="theme-swatches" aria-hidden="true">
                    <span style="--swatch: #D9782F"></span><span style="--swatch: #5A3F5F"></span><span style="--swatch: #8B5E3C"></span><span style="--swatch: #F5EEDC"></span><span style="--swatch: #496E6E"></span>
                  </span>
                </span>
              </label>
              <label class="theme-option">
                <input type="radio" name="theme" value="morning-mist">
                <span class="theme-option-copy">
                  <span class="theme-name">Morning Mist</span>
                  <span class="theme-description">Airy fog, pine &amp; soft blue-gray</span>
                  <span class="theme-swatches" aria-hidden="true">
                    <span style="--swatch: #F2F4F3"></span><span style="--swatch: #D9E2E1"></span><span style="--swatch: #A3B5B2"></span><span style="--swatch: #2C3633"></span><span style="--swatch: #C2B280"></span>
                  </span>
                </span>
              </label>
              <label class="theme-option">
                <input type="radio" name="theme" value="village-heritage">
                <span class="theme-option-copy">
                  <span class="theme-name">Village Heritage</span>
                  <span class="theme-description">Alpine cream, forest &amp; barn red</span>
                  <span class="theme-swatches" aria-hidden="true">
                    <span style="--swatch: #FFF9F0"></span><span style="--swatch: #2B4C3F"></span><span style="--swatch: #A33529"></span><span style="--swatch: #E8DCC3"></span><span style="--swatch: #1E1E1E"></span>
                  </span>
                </span>
              </label>
              <label class="theme-option">
                <input type="radio" name="theme" value="night-sky">
                <span class="theme-option-copy">
                  <span class="theme-name">Night Sky</span>
                  <span class="theme-description">Midnight blue, starlight &amp; warm gold</span>
                  <span class="theme-swatches" aria-hidden="true">
                    <span style="--swatch: #0B1426"></span><span style="--swatch: #13213A"></span><span style="--swatch: #DEE5F0"></span><span style="--swatch: #9FC7F5"></span><span style="--swatch: #E0C58A"></span>
                  </span>

              </label>
            </div>
          </fieldset>
        </div>
        <button class="theme-trigger" type="button" aria-label="Choose theme (current: Deep Lake &amp; Lodge)" aria-expanded="false" aria-controls="theme-panel">

  <script id="alert-dismissals">
    (() => {
      const banner = document.querySelector('.alerts-banner');
      if (!banner) return;
      const root = banner.closest('.homepage-conditions');
      const rows = [...banner.querySelectorAll('.alert-item')];
      const groups = [...banner.querySelectorAll('.alert-group')];
      const dismissed = new Set();
      const savedDismissals = new Set();
      const key = row => 'lakearrowhead-dismissed-alert:v1:' + row.dataset.alertId;

      function update(pending = false) {
        const focusedRow = rows.find(row => row.contains(document.activeElement));
        for (const row of rows) row.hidden = pending || dismissed.has(row.dataset.alertId) || savedDismissals.has(row.dataset.alertId);
        for (const group of groups) group.hidden = !rows.some(row => !row.hidden && group.contains(row));
        const visible = rows.filter(row => !row.hidden);
        banner.hidden = visible.length === 0;
        if (root) {
          const weather = !!root.querySelector('.weather-card');
          const notice = !!root.querySelector('.conditions-unavailable');
          root.classList.toggle('has-alerts', !banner.hidden);
          root.querySelector('.conditions-row').hidden = banner.hidden && !weather;
          root.hidden = banner.hidden && !weather && !notice;
        }
        if (!pending && focusedRow?.hidden) {
          const target = visible[0]?.querySelector('summary') || document.querySelector('.site-title');
          target?.focus({ preventScroll: true });
        }
      }

      function checkStorage() {
        savedDismissals.clear();
        for (const row of rows) {
          try {
            if (localStorage.getItem(key(row)) === '1') savedDismissals.add(row.dataset.alertId);
          } catch { /* Show alerts whose saved dismissal cannot be read. */ }
        }
        update();
      }

      for (const row of rows) row.querySelector('.alert-dismiss').addEventListener('click', () => {
        dismissed.add(row.dataset.alertId);
        update();
        try { localStorage.setItem(key(row), '1'); } catch { /* Keep this page's dismissal in memory. */ }
      });
      // A back/forward-cache snapshot must also wait for a fresh storage check.
      window.addEventListener('pagehide', () => update(true));
      window.addEventListener('pageshow', checkStorage);
      checkStorage();
    })();
  </script>
  <script id="scroll-to-top">
    (() => {
      const button = document.getElementById('back-to-top');
      const ring = button.querySelector('.scroll-progress');
      const page = document.scrollingElement || document.documentElement;
      let framePending = false;

      function updateProgress() {
        framePending = false;
        const distance = Math.max(0, page.scrollHeight - page.clientHeight);
        const offset = Math.min(distance, Math.max(0, page.scrollTop));
        const progress = distance > 0 ? offset / distance : 0;
        ring.style.strokeDashoffset = String(100 * (1 - progress));
        const hidden = offset === 0;
        if (hidden && document.activeElement === button) {
          document.querySelector('.site-title').focus({ preventScroll: true });
        }
        button.hidden = hidden;
      }

      function scheduleUpdate() {
        if (framePending) return;
        framePending = true;
        requestAnimationFrame(updateProgress);
      }

      button.addEventListener('click', () => {
        window.scrollTo({
          top: 0,
          behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth',
        });
      });
      window.addEventListener('scroll', scheduleUpdate, { passive: true });
      window.addEventListener('resize', scheduleUpdate);
      window.addEventListener('pageshow', scheduleUpdate);
      window.addEventListener('load', scheduleUpdate, true);
      if ('ResizeObserver' in window) {
        const observer = new ResizeObserver(scheduleUpdate);
        observer.observe(document.body);
      }
      updateProgress();
    })();
  </script>
  <script id="theme-picker">
    (() => {
      const picker = document.querySelector('.theme-picker');
      const trigger = picker.querySelector('.theme-trigger');
      const panel = document.getElementById('theme-panel');
      const radios = [...picker.querySelectorAll('input[name="theme"]')];
      const themeColor = document.querySelector('meta[name="theme-color"]');
      let arrowNavigation = false;

      function applyTheme(value, persist = false) {
        const selected = radios.find(radio => radio.value === value) || radios[0];
        document.documentElement.dataset.theme = selected.value;
        window.loadThemeFont?.(selected.value);
        selected.checked = true;
        const name = selected.closest('label').querySelector('.theme-name').textContent;
        trigger.setAttribute('aria-label', `Choose theme (current: ${name})`);
        trigger.title = `Choose theme (current: ${name})`;
        themeColor.content = getComputedStyle(document.documentElement).getPropertyValue('--page-bg').trim();
        if (persist) {
          try {
            const secure = location.protocol === 'https:' ? '; Secure' : '';
            document.cookie = `lakearrowhead_theme=${selected.value}; Max-Age=31536000; Path=/; SameSite=Lax${secure}`;
          } catch {
            // Keep the current selection usable even when cookies are blocked.
          }
        }
      }

      function closePicker(restoreFocus = false) {
        arrowNavigation = false;
        panel.hidden = true;
        trigger.setAttribute('aria-expanded', 'false');
        if (restoreFocus) trigger.focus({ preventScroll: true });
      }

      function fitPanel() {
        const available = innerHeight - trigger.getBoundingClientRect().bottom - 24;
        panel.style.maxHeight = `${Math.min(Math.max(0, innerHeight - 24), Math.max(44, available))}px`;
        const selected = radios.find(radio => radio.checked).closest('label');
        if (selected.offsetTop < panel.scrollTop || selected.offsetHeight > panel.clientHeight) {
          panel.scrollTop = selected.offsetTop;
        } else if (selected.offsetTop + selected.offsetHeight > panel.scrollTop + panel.clientHeight) {
          panel.scrollTop = selected.offsetTop + selected.offsetHeight - panel.clientHeight;
        }
      }

      window.addEventListener('resize', () => { if (!panel.hidden) fitPanel(); });
      window.addEventListener('blur', () => { if (!panel.hidden) closePicker(); });
      trigger.addEventListener('click', () => {
        if (panel.hidden) {
          panel.hidden = false;
          fitPanel();
          trigger.setAttribute('aria-expanded', 'true');
          radios.find(radio => radio.checked).focus({ preventScroll: true });
        } else {
          closePicker(true);
        }
      });
      for (const radio of radios) {
        // Leave the panel open for previews and native arrow-key navigation.
        radio.addEventListener('change', () => {
          if (radio.checked) applyTheme(radio.value, true);
        });
        radio.addEventListener('click', () => {
          // An explicit choice also persists when that radio was already checked.
          if (radio.checked && !arrowNavigation) {
            applyTheme(radio.value, true);
            closePicker(true);
          }
        });
        radio.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            applyTheme(radio.value, true);
            closePicker(true);
          }
        });
      }
      picker.addEventListener('keydown', event => {
        // Native radio arrow navigation can also synthesize a click.
        arrowNavigation = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key);
        // Continue native Tab navigation from the button after hiding the radios.
        if (event.key === 'Tab' && !panel.hidden) closePicker(true);
      });
      document.addEventListener('keyup', () => { arrowNavigation = false; });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !panel.hidden) {
          event.preventDefault();
          closePicker(true);
        }
      });
      document.addEventListener('pointerdown', event => {
        arrowNavigation = false;
        if (!panel.hidden && !picker.contains(event.target)) {
          closePicker();
        }
      });
      picker.addEventListener('focusout', event => {
        // WebKit blurs a radio before forwarding a label click, with no focus target.
        // Only dismiss for a known outside target; pointerdown handles outside clicks.
        if (event.relatedTarget && !picker.contains(event.relatedTarget)) closePicker();
      });

      applyTheme(document.documentElement.dataset.theme);
      picker.hidden = false;
    })();
  </script>
  <script id="relative-times">
    (() => {
      const times = [...document.querySelectorAll('time.post-time[datetime]')].map(time => ({
        element: time,
        timestamp: Date.parse(time.getAttribute('datetime')),
      })).filter(time => Number.isFinite(time.timestamp));
      if (!times.length) return;

      function updateTimes() {
        if (document.hidden) return;
        const now = Date.now();
        for (const { element, timestamp } of times) {
          const seconds = (now - timestamp) / 1000;
          const age = Math.abs(seconds);
          let label = 'just now';
          if (age >= 60) {
            const unit = age < 3600 ? 'min' : age < 86400 ? 'hr' : 'day';
            const count = Math.floor(age / (unit === 'min' ? 60 : unit === 'hr' ? 3600 : 86400));
            const amount = `${count} ${unit}${unit === 'day' && count !== 1 ? 's' : ''}`;
            label = seconds < 0 ? `in ${amount}` : `${amount} ago`;
          }
          element.textContent = label;
        }
      }

      updateTimes();
      setInterval(updateTimes, 60000);
      document.addEventListener('visibilitychange', updateTimes);
    })();
  </script>
